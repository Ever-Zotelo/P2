<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 6. Las migas de pan</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
    background-color: #f8f9fa;
  }

  .migas ul {
    display: flex;
    align-items: center;
    list-style: none;
    padding: 0;
    margin: 0;
    gap: 8px;
  }

  .migas a {
    color: #2563eb;
    text-decoration: none;
  }

  .migas a:hover {
    text-decoration: underline;
  }

  .migas li:not(:last-child)::after {
    content: "/";
    margin-left: 8px;
    color: #6b7280;
  }
  
  .migas li.actual {
    color: #6b7280;
  }
</style>
</head>
<body>
<nav class="migas">
  <ul>
    <li><a href="#">Inicio</a></li>
    <li><a href="#">Pedidos</a></li>
    <li class="actual">Pedido 1024</li>
  </ul>
</nav>
</body>
</html>
