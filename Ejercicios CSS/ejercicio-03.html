<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 3. Los avisos de la aplicación</title>
<style>

    .aviso {
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 5px solid;
        margin-bottom: 12px;
    }

    .info{
        background-color:lightblue;
        border-left-color: blue;
        color:blueviolet;
    }

    .exito{
        background-color: lightgreen;
        border-left-color: green;
        color:darkgreen;
    }

    .error{
        background-color: rgb(240, 197, 197);
        border-left-color: red;
        color: rgb(146, 24, 24);
    }
</style>
</head>
<body>
<p class="aviso info">Tu sesión caduca en cinco minutos.</p>
<p class="aviso exito">El pedido se ha guardado correctamente.</p>
<p class="aviso error">No se ha podido conectar con el servidor.</p>
</body>
</html>
