<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 14. La barra de progreso</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
    background-color: #f8f9fa;
    max-width: 400px;
  }

  p {
    margin-bottom: 8px;
    color: #374151;
    font-size: 0.95rem;
  }

  .barra {
    width: 100%;
    height: 16px;
    background-color: #e5e7eb;
    border-radius: 9999px;
    overflow: hidden; 
  }

  .relleno {
    display: block;
    height: 100%;
    width: 68%;
    background: linear-gradient(90deg, #4f46e5, #818cf8);
    border-radius: 9999px 0 0 9999px;
  }
</style>
</head>
<body>
<p>Subiendo el archivo...</p>
<div class="barra"><span class="relleno"></span></div>
</body>
</html>
