<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 10. El formulario de acceso</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
    background-color: #f8f9fa;
    max-width: 360px;
  }

  .acceso > label:not(.opcion) {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
    color: #111827;
  }

  .acceso input[type="email"],
  .acceso input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    box-sizing: border-box;
    outline: none;
  }

  .acceso input[type="email"]:focus,
  .acceso input[type="password"]:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
  }

  .acceso input[type="email"]:user-invalid,
  .acceso input[type="email"]:invalid:not(:placeholder-shown) {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
  }

  .acceso .opcion {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 20px 0;
    font-size: 0.9rem;
    color: #374151;
    cursor: pointer;
  }

  .acceso input[type="checkbox"] {
    cursor: pointer;
  }

  .acceso button {
    width: 100%;
    padding: 10px;
    background-color: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
  }

  .acceso button:hover {
    background-color: #4338ca;
  }
</style>
</head>
<body>
<form class="acceso">
  <label for="correo">Correo electrónico</label>
  <input type="email" id="correo" placeholder="tu@correo.es" required>

  <label for="clave">Contraseña</label>
  <input type="password" id="clave" required>

  <label class="opcion"><input type="checkbox" checked> Recordarme en este equipo</label>

  <button type="submit">Entrar</button>
</form>
</body>
</html>
