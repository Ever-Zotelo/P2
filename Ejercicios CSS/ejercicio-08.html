<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 8. El buscador</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
    background-color: #f8f9fa;
    max-width: 500px;
  }

  .buscador {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .buscador input[type="search"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    box-sizing: border-box;
    outline: none;
  }

  .buscador input[type="search"]:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
  }

  .buscador button {
    padding: 10px 18px;
    background-color: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
  }

  .buscador button:hover {
    background-color: #4338ca;
  }

  .resultados {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .resultados li {
    border-bottom: 1px solid #e5e7eb;
  }

  .resultados a {
    display: block;
    padding: 12px 0;
    color: #374151;
    text-decoration: none;
  }

  .resultados a:hover {
    color: #4f46e5;
  }
</style>
</head>
<body>
<form class="buscador">
  <input type="search" placeholder="Buscar pedidos...">
  <button type="submit">Buscar</button>
</form>

<ul class="resultados">
  <li><a href="#">Pedido 1024, cliente Ana Ruiz</a></li>
  <li><a href="#">Pedido 1025, cliente Luis Perez</a></li>
</ul>
</body>
</html>
