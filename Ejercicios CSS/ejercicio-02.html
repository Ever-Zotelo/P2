<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 2. Las etiquetas de estado</title>
<style>
    
.etiqueta {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.pagado {
    background-color: #d4edda;
    color: #155724;
}

.pendiente {
    background-color: #fff3cd;
    color: #856404;
}

.anulado {
    background-color: #f8d7da;
    color: #721c24;
}

</style>
</head>
<body>
<p>Pedido 1024 <span class="etiqueta pagado">Pagado</span></p>
<p>Pedido 1025 <span class="etiqueta pendiente">Pendiente</span></p>
<p>Pedido 1026 <span class="etiqueta anulado">Anulado</span></p>
</body>
</html>
