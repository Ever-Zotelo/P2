<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 20. La portada de la app</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f8f9fa;
    color: #1f2937;
  }

  .app {
    max-width: 900px;
    margin: 0 auto;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }

  .cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #e5e7eb;
  }

  .cabecera h1 {
    margin: 0;
    font-size: 1.4rem;
    color: #4f46e5;
  }

  .cabecera nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .cabecera nav a {
    text-decoration: none;
    color: #4b5563;
    font-weight: 500;
  }

  .cabecera nav a:hover {
    color: #4f46e5;
  }

  .portada {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #ffffff;
    text-align: center;
    padding: 48px 24px;
  }

  .portada h2 {
    margin: 0 0 12px 0;
    font-size: 2rem;
    font-weight: 700;
  }

  .portada p {
    margin: 0 0 24px 0;
    font-size: 1.1rem;
    opacity: 0.9;
  }

  .portada .cta {
    display: inline-block;
    background-color: #ffffff;
    color: #4f46e5;
    padding: 12px 28px;
    border-radius: 9999px;
    text-decoration: none;
    font-weight: 600;
    transition: background-color 0.2s ease;
  }

  .portada .cta:hover {
    background-color: #f3f4f6;
  }

  .rejilla {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 32px 24px;
  }

  .caja {
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .caja h3 {
    margin: 0 0 8px 0;
    color: #4f46e5; 
    font-size: 1.2rem;
  }

  .caja p {
    margin: 0;
    color: #6b7280;
    font-size: 0.95rem;
  }

  .pie {
    text-align: center;
    padding: 20px 24px;
    border-top: 1px solid #e5e7eb;
    color: #6b7280;
    font-size: 0.9rem;
  }

  .pie p {
    margin: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header class="cabecera">
    <h1>Planazo</h1>
    <nav>
      <ul>
        <li><a href="#">Planes</a></li>
        <li><a href="#">Publicar</a></li>
      </ul>
    </nav>
  </header>

  <section class="portada">
    <h2>Planes gratis en tu ciudad</h2>
    <p>Conciertos, rutas y talleres, todo gratis.</p>
    <a class="cta" href="#">Ver planes</a>
  </section>

  <section class="rejilla">
    <article class="caja"><h3>Conciertos</h3><p>Más de 40 este mes.</p></article>
    <article class="caja"><h3>Rutas</h3><p>Senderismo y bici.</p></article>
    <article class="caja"><h3>Talleres</h3><p>Cocina, foto y más.</p></article>
  </section>

  <footer class="pie"><p>Planazo. Todo gratis, en tu ciudad.</p></footer>
</div>
</body>
</html>
