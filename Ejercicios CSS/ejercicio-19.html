<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 19. La ventana modal</title>
<style>
  .escena {
    position: relative;
    width: 100%;
    height: 350px;
    background-color: #9ca3af;
    border-radius: 12px;
    overflow: hidden;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .modal {
    background-color: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    text-align: center;
    max-width: 300px;
    width: 100%;
  }

  .modal h3 {
    margin: 0 0 8px 0;
    color: #111827;
    font-size: 1.1rem;
  }

  .modal p {
    margin: 0 0 20px 0;
    color: #6b7280;
    font-size: 0.9rem;
  }

  .botones {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .cancelar {
    background-color: #e5e7eb;
    color: #374151;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }

  .aceptar {
    background-color: #dc2626;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="escena">
  <div class="overlay">
    <div class="modal">
      <h3>¿Eliminar el pedido?</h3>
      <p>Esta acción no se puede deshacer.</p>
      <div class="botones">
        <button class="cancelar">Cancelar</button>
        <button class="aceptar">Eliminar</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
