<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 11. La ficha de perfil</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f9fafb;
    font-family: system-ui, -apple-system, sans-serif;
  }

  .perfil {
    width: 280px;
    margin: 0 auto;
    padding: 24px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    background-color: #ffffff;
    text-align: center;
    cursor: default;
  }

  .perfil .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 12px auto;
    display: block;
  }

  .perfil h3 {
    margin: 0 0 4px 0;
    font-size: 1.1rem;
    color: #111827;
  }

  .perfil .puesto {
    margin: 0 0 16px 0;
    font-size: 0.9rem;
    color: #6b7280;
  }

  .perfil .datos {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .perfil .datos li {
    padding: 10px 0;
    border-top: 1px solid #f3f4f6;
    font-size: 0.875rem;
    color: #4b5563;
  }
</style>
</head>
<body>
<div class="perfil">
  <img class="avatar" src="img/ejemplo.png" alt="Foto de perfil">
  <h3>Ana Ruiz</h3>
  <p class="puesto">Administrativa</p>
  <ul class="datos">
    <li>ana.ruiz@correo.es</li>
    <li>Málaga</li>
    <li>Alta en 2023</li>
  </ul>
</div>
</body>
</html>
