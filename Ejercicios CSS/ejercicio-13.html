<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 13. La galería de imágenes</title>
<style>
  .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .galeria img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="galeria">
  <img src="img/ejemplo.png" alt="Foto 1">
  <img src="img/ejemplo.png" alt="Foto 2">
  <img src="img/ejemplo.png" alt="Foto 3">
  <img src="img/ejemplo.png" alt="Foto 4">
  <img src="img/ejemplo.png" alt="Foto 5">
  <img src="img/ejemplo.png" alt="Foto 6">
</div>
</body>
</html>
