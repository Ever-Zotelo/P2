<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 17. La tabla de precios</title>
<style>
  .planes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    align-items: center;
  }

  .plan {
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }

  .plan h3 {
    text-transform: uppercase;
    color: #6b7280;
    font-size: 0.875rem;
    letter-spacing: 1px;
    margin: 0 0 8px 0;
  }

  .plan .precio {
    font-size: 2rem;
    font-weight: bold;
    color: #111827;
    margin: 0 0 16px 0;
  }

  .plan ul {
    list-style: none;
    padding: 0;
    margin: 0 0 24px 0;
  }

  .plan li {
    padding: 6px 0;
    color: #4b5563;
    font-size: 0.95rem;
  }

  .plan .elegir {
    display: block;
    padding: 10px;
    background-color: #eff6ff;
    color: #4f46e5;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }

  .plan.destacado {
    border: 2px solid #4f46e5;
    box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
  }
</style>
</head>
<body>
<div class="planes">
  <article class="plan">
    <h3>Básico</h3>
    <p class="precio">0 euros</p>
    <ul><li>1 usuario</li><li>1 GB</li><li>Sin soporte</li></ul>
    <a class="elegir" href="#">Elegir</a>
  </article>
  <article class="plan destacado">
    <h3>Pro</h3>
    <p class="precio">12 euros</p>
    <ul><li>5 usuarios</li><li>50 GB</li><li>Con soporte</li></ul>
    <a class="elegir" href="#">Elegir</a>
  </article>
  <article class="plan">
    <h3>Empresa</h3>
    <p class="precio">29 euros</p>
    <ul><li>Ilimitados</li><li>500 GB</li><li>Con soporte</li></ul>
    <a class="elegir" href="#">Elegir</a>
  </article>
</div>
</body>
</html>
