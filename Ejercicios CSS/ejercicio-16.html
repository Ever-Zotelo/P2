<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 16. Las burbujas de un chat</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
    background-color: #f8f9fa;
    max-width: 450px;
  }

  .chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mensaje {
    margin: 0;
    padding: 10px 14px;
    max-width: 75%;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.4;
    
    align-self: flex-start;
    background-color: #e5e7eb;
    color: #1f2937;
  }

  .mensaje.mio {
    align-self: flex-end;
    background-color: #4f46e5;
    color: #ffffff;
  }
</style>
</head>
<body>
<div class="chat">
  <p class="mensaje">Hola, ¿el pedido 1024 ya ha salido?</p>
  <p class="mensaje mio">Sí, salió esta mañana.</p>
  <p class="mensaje">Perfecto, gracias.</p>
</div>
</body>
</html>
